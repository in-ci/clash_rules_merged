name: Update Rules List

on:
  schedule:
    - cron: '0 0 * * *'    # 0点执行一次（UTC）
  workflow_dispatch:       # 手动触发
  push:                    # 代码提交触发

jobs:
  update-ip-list:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run clash_rules_merged.py
        run: python clash_rules_merged.py

      # --- 新增：下载并准备 Mihomo 内核 ---
      - name: 📥 Download Mihomo
        run: |
          # 下载最新的 Mihomo 内核 (amd64)
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.18/mihomo-linux-amd64-compatible-v1.19.18.gz
          gunzip mihomo-linux-amd64-compatible-v1.19.18.gz
          mv mihomo-linux-amd64-compatible-v1.19.18 mihomo
          chmod +x mihomo

      # --- 新增：转换生成的 YAML 为 MRS ---
      - name: ⚙️ Convert Rules to MRS
        run: |
          ./mihomo convert-ruleset domain yaml clash_direct_domain_rules_merged.txt clash_direct.mrs
          ./mihomo convert-ruleset domain yaml clash_proxy_domain_rules_merged.txt clash_proxy.mrs
          ./mihomo convert-ruleset domain yaml clash_reject_domain_rules_merged.txt clash_reject.mrs
      # ------------------------------------

      - name: ✅ Commit and push
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"      

          # 检查是否有变更（包括新生成的 .mrs 文件）
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes detected, skipping commit."
          else
            git add .
            git commit -m "Automatic update and MRS conversion by ${{ github.actor }}"
            git push
          fi

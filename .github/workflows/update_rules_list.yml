name: Update Rules List

on:
  schedule:
    - cron: '0 0 * * *'    # 0点执行一次（UTC）
  workflow_dispatch:       # 手动触发
  push:                    # 代码提交触发

jobs:
  update-ip-list:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run clash_rules_merged.py
        run: python clash_rules_merged.py

      # --- 新增：下载并准备 Mihomo 内核 ---
      - name: 📥 Download Mihomo
        run: |
          # 1. 通过 GitHub API 获取最新版本号 (Tag Name)
          LATEST_VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          echo "Latest version is $LATEST_VERSION"

          # 2. 拼接下载链接 (注意：API 获取的 tag 通常带有 'v'，文件名也带 'v')
          # 目标文件名格式：mihomo-linux-amd64-v1.19.18.gz
          FILENAME="mihomo-linux-amd64-${LATEST_VERSION}.gz"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_VERSION}/${FILENAME}"
          
          echo "Downloading from: $URL"

          # 3. 下载最新的 Mihomo 内核 (amd64)并解压
          # 先删除可能存在的旧文件，防止干扰
          rm -f mihomo.gz mihomo mihomo_bin
          
          wget -O mihomo.gz "$URL"
          
          # 使用 -f 强制解压，即使存在同名文件也会覆盖
          gunzip -f mihomo.gz
          
          # 重命名并赋予权限
          mv -f mihomo mihomo_bin
          chmod +x mihomo_bin

      # --- 新增：转换生成的 YAML 为 MRS ---
      - name: ⚙️ Convert Rules to MRS
        run: |
          ./mihomo_bin convert-ruleset domain yaml clash_direct_domain_rules_merged.txt clash_direct_domain_rules_merged.mrs
          ./mihomo_bin convert-ruleset domain yaml clash_proxy_domain_rules_merged.txt clash_proxy_domain_rules_merged.mrs
          ./mihomo_bin convert-ruleset domain yaml clash_reject_domain_rules_merged.txt clash_reject_domain_rules_merged.mrs
      # ------------------------------------

      - name: ✅ Commit and push
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"      

          # 检查是否有变更（包括新生成的 .mrs 文件）
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes detected, skipping commit."
          else
            git add .
            git commit -m "Automatic update and MRS conversion by ${{ github.actor }}"
            git push
          fi
